name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Verify release version
              run: |
                  manifest_version="$(node -p \"JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version\")"
                  package_version="$(node -p \"require('./package.json').version\")"
                  test "$GITHUB_REF_NAME" = "$manifest_version"
                  test "$GITHUB_REF_NAME" = "$package_version"

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      build/akki-obsidian/main.js
                      build/akki-obsidian/manifest.json
                      build/akki-obsidian/styles.css
                      build/akki-obsidian/LICENSE

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --draft \
                    "build/akki-obsidian/main.js" \
                    "build/akki-obsidian/manifest.json" \
                    "build/akki-obsidian/styles.css" \
                    "build/akki-obsidian/LICENSE"
