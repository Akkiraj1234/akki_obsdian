<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hobby Planner</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="index.js"></script>
</head>

<body>
    <main class="tracker">
        <section class="labels" aria-label="Hobby planner labels">
            <p class="lable-heading" id="lable-heading"></p>
            <div class="label-list" id="lable-lists"></div>
        </section>

        <section class="timeline-viewport" aria-label="Hobby planner timeline">
            <div class="timeline" id="timeline">
                <div class="timeline-track" id="timelineTrack">
                    <div class="timeline-months-row"></div>
                    <div class="timeline-data" id="timelineData">
                        <div class="timeline-grid" id="timelineGrid" aria-hidden="true"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
