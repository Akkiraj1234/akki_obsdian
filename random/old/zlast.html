<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hobby Planner</title>
    <link rel="stylesheet" href="some.css">
</head>

<body>
    <div class="tracker">
        <div class="labels" id="labels">
            <p class="lable-heading">Hobby Planner</p>
            <div class="label-list">
                <div class="label-section-row">Main skill</div>
                <div class="lable-row depth-1">
                    <span class="dot coding"></span>
                    <span class="lable-text"><p class="lable-name">Coding</p></span>
                </div>
                <div class="lable-row depth-2">
                    <span class="dot leetcode"></span>
                    <span class="lable-text"><p class="lable-name">LeetCode</p></span>
                </div>

                <div class="label-section-row">Hobbies</div>
                <div class="lable-row depth-1">
                    <span class="dot book-reading"></span>
                    <span class="lable-text"><p class="lable-name">Book reading</p></span>
                </div>
                <div class="lable-row depth-1">
                    <span class="dot sketching"></span>
                    <span class="lable-text"><p class="lable-name">Sketching</p></span>
                </div>

                <div class="label-section-row">Activity</div>
                <div class="lable-row depth-1">
                    <span class="dot chess"></span>
                    <span class="lable-text"><p class="lable-name">Chess</p></span>
                </div>

                <div class="label-section-row">Gym</div>
                <div class="lable-row depth-1">
                    <span class="dot home-workout"></span>
                    <span class="lable-text"><p class="lable-name">Home workout</p></span>
                </div>
            </div>
        </div>

        <div class="timeline-viewport">
            <div class="timeline" id="timeline">
                <div class="timeline-track" id="timelineTrack">
                    <div class="timeline-months-row">
                        <div data-month="2026-10">Oct</div>
                        <div data-month="2026-09">Sep</div>
                        <div data-month="2026-08">Aug</div>
                        <div data-month="2026-07">Jul</div>
                        <div data-month="2026-06">Jun</div>
                        <div data-month="2026-05">May</div>
                        <div data-month="2026-04">Apr</div>
                        <div data-month="2026-03">Mar</div>
                        <div data-month="2026-02">Feb</div>
                        <div data-month="2026-01">Jan</div>
                    </div>

                    <div class="timeline-data" id="timelineData">
                        <div class="timeline-grid" id="timelineGrid" aria-hidden="true"></div>

                        <!-- Main skill -->
                        <div class="timeline-section-row"></div>

                        <div class="timeline-activity-row">
                            <div class="activity-bar coding" style="grid-column: 1 / 7" title="Coding: May–October">
                            </div>
                        </div>

                        <div class="timeline-activity-row">
                            <div class="activity-bar leetcode" style="grid-column: 2 / 5"
                                title="LeetCode: July–September"></div>
                        </div>

                        <!-- Hobbies -->
                        <div class="timeline-section-row"></div>

                        <div class="timeline-activity-row">
                            <div class="activity-bar book-reading" style="grid-column: 5 / 10"
                                title="Book reading: February–June"></div>
                        </div>

                        <div class="timeline-activity-row">
                            <div class="activity-bar sketching" style="grid-column: 1 / 4"
                                title="Sketching: August–October"></div>
                        </div>

                        <!-- Activity -->
                        <div class="timeline-section-row"></div>

                        <div class="timeline-activity-row">
                            <div class="activity-bar chess" style="grid-column: 1 / 3" title="Chess: September–October">
                            </div>
                        </div>

                        <!-- Gym -->
                        <div class="timeline-section-row"></div>

                        <div class="timeline-activity-row">
                            <div class="activity-bar home-workout" style="grid-column: 1 / 6"
                                title="Home workout: June–October"></div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const timeline = document.querySelector("#timeline");
        const track = document.querySelector("#timelineTrack");
        const monthRow = document.querySelector(".timeline-months-row");
        const timelineData = document.querySelector("#timelineData");
        const timelineGrid = document.querySelector("#timelineGrid");
        const months = [...monthRow.children];
        const gridCells = months.map(() => {
            const cell = document.createElement("span");
            cell.className = "timeline-grid-cell";
            timelineGrid.append(cell);
            return cell;
        });

        const MONTH_WIDTH = 100;

        let selectedIndex = 0;
        let wheelDirection = 0;
        let wheelTimer = null;
        let selectionTimer = null;

        function updateGrid() {
            const selectedWidth = Math.max(
                MONTH_WIDTH,
                Math.floor(timeline.clientWidth / 2)
            );
            const columns = months.map((_, index) =>
                `${index === selectedIndex ? selectedWidth : MONTH_WIDTH}px`
            ).join(" ");

            const contentWidth =
                months.length * MONTH_WIDTH + selectedWidth - MONTH_WIDTH;

            // Leave enough blank space at the end for January to reach the active position.
            const tailWidth = Math.max(
                0,
                timeline.clientWidth - selectedWidth
            );

            track.style.setProperty("--content-width", `${contentWidth}px`);
            track.style.setProperty("--tail-width", `${tailWidth}px`);

            monthRow.style.gridTemplateColumns = columns;
            monthRow.style.width = `${contentWidth}px`;

            timelineGrid.style.gridTemplateColumns = columns;
            timelineData.style.width = `${contentWidth}px`;

            // Keep any activity rows aligned with the month columns.
            timelineData.querySelectorAll(".timeline-activity-row")
                .forEach(row => {
                    row.style.gridTemplateColumns = columns;
                    row.style.width = `${contentWidth}px`;
                });

            months.forEach((month, index) => {
                const isSelected = index === selectedIndex;
                month.classList.toggle(
                    "selected",
                    isSelected
                );
                gridCells[index].classList.toggle("selected", isSelected);
            });
        }

        function selectMonth(index, behavior = "smooth") {
            selectedIndex = Math.max(
                0,
                Math.min(months.length - 1, index)
            );

            // Resize the selected column and its matching data columns.
            updateGrid();

            // All columns before the selected one are now 100px wide.
            timeline.scrollTo({
                left: selectedIndex * MONTH_WIDTH,
                behavior
            });
        }

        // Translate a wheel gesture into one-month-at-a-time movement.
        timeline.addEventListener("wheel", event => {
            const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY)
                ? event.deltaX
                : event.deltaY;

            if (delta === 0) return;

            event.preventDefault();

            wheelDirection = delta > 0 ? 1 : -1;

            clearTimeout(wheelTimer);
            wheelTimer = setTimeout(() => {
                selectMonth(selectedIndex + wheelDirection);
                wheelDirection = 0;
            }, 80);
        }, { passive: false });

        // Keep the selected position valid if the panel changes width.
        window.addEventListener("resize", () => {
            updateGrid();
            timeline.scrollTo({
                left: selectedIndex * MONTH_WIDTH,
                behavior: "auto"
            });
        });

        // Start with October selected.
        updateGrid();
    </script>
</body>

</html>
